<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background: #050505;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
        }

        .left-panel {
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 40%),
                #000;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4rem;
        }

        .hero-title {
            font-size: 4rem;
            line-height: 1;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .hero-text {
            color: #b3b3b3;
            line-height: 1.7;
            max-width: 400px;
        }

        .right-panel {
            padding: 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-form {
            width: 100%;
            max-width: 450px;
        }

        .login-form h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
        }

        .login-form p {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #333;
            background: #111;
            color: white;
            font-size: 1rem;
            transition: 0.25s;
        }

        input:focus {
            outline: none;
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            border: none;
            border-radius: 12px;
            background: white;
            color: black;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
        }

        .forgot-password {
            text-align: right;
            margin-top: 0.75rem;
        }

        .forgot-password a,
        .signup-link a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .forgot-password a:hover,
        .signup-link a:hover {
            text-decoration: underline;
        }

        .signup-link {
            margin-top: 1.5rem;
            text-align: center;
            color: #888;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .left-panel {
                display: none;
            }

            .right-panel {
                padding: 2rem;
            }
        }

        @media (max-width: 500px) {
            .login-form h1 {
                font-size: 1.8rem;
            }

            input,
            button {
                padding: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left-panel">
            <div class="logo">CHAT APP</div>

            <h2 class="hero-title">
                Welcome<br>
                Back.
            </h2>

            <p class="hero-text">
                Sign in to continue your conversations, reconnect with your
                friends, and access your messages securely.
            </p>
        </div>

        <div class="right-panel">

            <form class="login-form" action="/login" method="POST">

                <h1>Welcome Back</h1>
                <p>Login to your account</p>

                <div class="form-group">
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>

                <div class="form-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <div class="forgot-password">
                    <a href="/forgot-password">Forgot Password?</a>
                </div>

                <button type="submit">
                    Login
                </button>

                <div class="signup-link">
                    Don't have an account?
                    <a href="/signup">Create Account</a>
                </div>

            </form>

        </div>

    </div>

</body>

</html>
