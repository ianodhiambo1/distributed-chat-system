<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Chat Test</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111827;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 700px;
            background: #1f2937;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .top-bar {
            padding: 15px;
            background: #374151;
            display: flex;
            gap: 10px;
        }

        .top-bar input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
        }

        .top-bar button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 75%;
            word-wrap: break-word;
        }

        .sent {
            align-self: flex-end;
            background: #2563eb;
        }

        .received {
            align-self: flex-start;
            background: #4b5563;
        }

        .bottom-bar {
            display: flex;
            padding: 15px;
            gap: 10px;
            background: #374151;
        }

        .bottom-bar input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
        }

        .bottom-bar button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #10b981;
            color: white;
            cursor: pointer;
        }

        .status {
            padding: 10px 15px;
            background: #111827;
            font-size: 14px;
            border-top: 1px solid #374151;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="top-bar">
            <input type="text" id="ws-url" value="ws://localhost:8000/ws" />

            <button onclick="connectWebSocket()">Connect</button>
        </div>

        <div id="messages" class="messages"></div>

        <div class="bottom-bar">
            <input type="text" id="message-input" placeholder="Type message..." />

            <button onclick="sendMessage()">Send</button>
        </div>

        <div id="status" class="status">
            Disconnected
        </div>

    </div>

    <script src="frontend.js" ></script>
